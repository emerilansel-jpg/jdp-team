<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager Dashboard — JDP Team</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { colors: { brand: {600:'#4f46e5',700:'#4338ca'}, slate:{950:'#020617'} } } } }</script>
</head>
<body class="min-h-screen bg-slate-950 text-white">
  <header class="border-b border-white/10 bg-slate-900/60 backdrop-blur sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="text-lg font-black tracking-tight">JDP<span class="text-brand-600">.team</span></div>
        <span class="text-xs text-slate-400 border border-white/10 rounded-full px-2 py-0.5">Manager</span>
      </div>
      <div class="flex items-center gap-3 text-sm">
        <span class="text-slate-300" id="userName">…</span>
        <button onclick="dash.logout()" class="text-slate-400 hover:text-white">Sign out</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-5">
      <h1 class="text-lg font-bold">Order pipeline</h1>
      <button onclick="loadAll()" class="text-sm text-slate-400 hover:text-white">↻ Refresh</button>
    </div>

    <!-- Kanban -->
    <div id="board" class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-3"></div>

    <!-- Order drawer -->
    <div id="drawer" class="hidden fixed inset-y-0 right-0 w-full max-w-xl bg-slate-900 border-l border-white/10 z-20 flex flex-col">
      <div class="p-5 border-b border-white/10 flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 id="drTitle" class="font-bold truncate"></h2>
          <div id="drMeta" class="text-sm text-slate-400 mt-1"></div>
        </div>
        <button onclick="closeDrawer()" class="text-slate-400 hover:text-white text-xl leading-none">×</button>
      </div>
      <div class="flex-1 overflow-y-auto p-5 space-y-5">
        <div>
          <h3 class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Status</h3>
          <div class="flex flex-wrap gap-2" id="drStatusBtns"></div>
        </div>
        <div>
          <h3 class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Brief</h3>
          <p id="drBrief" class="text-sm text-slate-300 whitespace-pre-wrap bg-slate-950/60 rounded-lg p-3"></p>
        </div>
        <div>
          <h3 class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Items & assignment</h3>
          <div id="drItems" class="space-y-2"></div>
        </div>
        <div>
          <h3 class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Conversation</h3>
          <div id="drMsgs" class="space-y-3 max-h-64 overflow-y-auto pr-1"></div>
          <form onsubmit="sendMsg(event)" class="mt-3 space-y-2">
            <div class="flex gap-2">
              <input id="msgInput" class="flex-1 rounded-lg bg-slate-950 border border-white/10 px-3.5 py-2.5 text-sm focus:border-brand-600 focus:outline-none" placeholder="Message client…" maxlength="2000" required>
              <button class="bg-brand-600 hover:bg-brand-700 rounded-lg px-4 py-2 text-sm font-bold">Send</button>
            </div>
            <label class="flex items-center gap-2 text-xs text-slate-400">
              <input type="checkbox" id="msgInternal" class="accent-indigo-500"> Internal note (hidden from client)
            </label>
          </form>
        </div>
      </div>
    </div>
  </main>

<script src="/dashboard/dash.js"></script>
<script>
const COLUMNS = ['new','scoping','quoted','in_progress','review','delivered','completed','cancelled'];
const VALID_ITEM_STATUS = ['queued','assigned','working','review','done'];
let orders = [];
let staff = [];
let selected = null;

async function boot() {
  if (!(await dash.init('manager'))) return;
  await loadAll();
}
async function loadAll() {
  const [oRes, sRes] = await Promise.all([fetch('/api/orders'), fetch('/api/staff')]);
  orders = (await oRes.json()).orders || [];
  staff = (await sRes.json()).staff || [];
  renderBoard();
  if (selected) renderDrawer();
}
function renderBoard() {
  document.getElementById('board').innerHTML = COLUMNS.map(col => {
    const inCol = orders.filter(o => o.status === col);
    return `
      <div class="bg-white/5 border border-white/10 rounded-xl p-2.5 min-h-[120px]">
        <div class="text-[11px] font-bold uppercase tracking-wide text-slate-400 mb-2 flex justify-between">
          <span>${col.replace(/_/g,' ')}</span><span>${inCol.length}</span>
        </div>
        <div class="space-y-2">
          ${inCol.map(o => `
            <button onclick="openDrawer('${o.id}')" class="w-full text-left bg-slate-900/80 hover:bg-slate-800 border ${selected===o.id?'border-brand-600':'border-white/10'} rounded-lg p-2.5 transition-colors">
              <div class="text-xs font-semibold truncate">${dash.esc((o.brief||'').split('\n')[0].slice(0,40)) || 'Order'}</div>
              <div class="text-[11px] text-slate-500 mt-1 flex justify-between">
                <span class="truncate">${dash.esc(o.client_name || o.client_email || '')}</span>
                <span class="font-semibold text-slate-300">${dash.money(o.total_cents)}</span>
              </div>
            </button>`).join('') || '<div class="text-[11px] text-slate-600 text-center py-3">—</div>'}
        </div>
      </div>`;
  }).join('');
}
function openDrawer(id) { selected = id; document.getElementById('drawer').classList.remove('hidden'); renderDrawer(); loadMessages(); }
function closeDrawer() { selected = null; document.getElementById('drawer').classList.add('hidden'); renderBoard(); }
function renderDrawer() {
  const o = orders.find(x => x.id === selected);
  if (!o) return closeDrawer();
  document.getElementById('drTitle').textContent = (o.brief||'').split('\n')[0].slice(0,80) || 'Order ' + o.id;
  document.getElementById('drMeta').textContent = `${o.client_name || o.client_email} · ${dash.fmtDate(o.created_at)} · ${dash.money(o.total_cents)} ${o.billing_cycle==='monthly'?'/mo':''}`;
  document.getElementById('drBrief').textContent = o.brief || '';
  document.getElementById('drStatusBtns').innerHTML = COLUMNS.map(s =>
    `<button onclick="setStatus('${s}')" class="px-2.5 py-1 rounded-lg border text-[11px] font-bold uppercase tracking-wide ${o.status===s?'bg-brand-600 border-brand-600':'border-white/15 text-slate-400 hover:text-white'}">${s.replace(/_/g,' ')}</button>`
  ).join('');
  const crew = staff.filter(s => s.role === 'crew');
  document.getElementById('drItems').innerHTML = o.items.map(i => `
    <div class="bg-slate-950/60 border border-white/10 rounded-lg p-3 space-y-2">
      <div class="flex items-center justify-between text-sm">
        <span>${dash.esc(i.service_name)} × ${i.qty} ${i.unit}${i.qty>1?'s':''}</span>
        ${dash.statusBadge(i.status)}
      </div>
      <div class="flex gap-2">
        <select class="flex-1 bg-slate-900 border border-white/10 rounded-lg px-2.5 py-1.5 text-xs" onchange="assign('${i.id}', this.value)">
          <option value="">— Assign crew —</option>
          ${crew.map(c => `<option value="${c.id}" ${i.assigned_crew_id===c.id?'selected':''}>${dash.esc(c.display_name)}</option>`).join('')}
        </select>
        <select class="bg-slate-900 border border-white/10 rounded-lg px-2.5 py-1.5 text-xs" onchange="setItemStatus('${i.id}', this.value)">
          ${VALID_ITEM_STATUS.map(s => `<option value="${s}" ${i.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>`).join('');
}
async function patch(body) {
  const res = await fetch('/api/orders', { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (res.ok) await loadAll();
}
function setStatus(s) { patch({ order_id: selected, status: s }); }
function assign(itemId, crewId) { patch({ order_id: selected, item_id: itemId, assign_crew_id: crewId || null }); }
function setItemStatus(itemId, s) { patch({ order_id: selected, item_id: itemId, item_status: s }); }
async function loadMessages() {
  if (!selected) return;
  const res = await fetch('/api/messages?order_id=' + selected);
  const msgs = (await res.json()).messages || [];
  document.getElementById('drMsgs').innerHTML = msgs.length ? msgs.map(m => `
    <div class="rounded-xl px-3.5 py-2.5 text-sm ${m.kind==='internal'?'bg-amber-500/10 border border-amber-500/30':'bg-slate-800 border border-white/10'}">
      <div class="text-[11px] text-slate-400 mb-0.5">${dash.esc(m.display_name)} (${m.role})${m.kind==='internal'?' · internal':''} · ${dash.fmtDate(m.created_at)}</div>
      ${dash.esc(m.body)}
    </div>`).join('') : '<div class="text-slate-500 text-sm text-center py-3">No messages yet.</div>';
}
async function sendMsg(e) {
  e.preventDefault();
  const input = document.getElementById('msgInput');
  const internal = document.getElementById('msgInternal').checked;
  const res = await fetch('/api/messages', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ order_id: selected, body: input.value, kind: internal ? 'internal' : 'client' })
  });
  if (res.ok) { input.value = ''; document.getElementById('msgInternal').checked = false; loadMessages(); }
}
boot();
</script>
</body>
</html>
