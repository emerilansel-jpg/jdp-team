<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Dashboard — JDP Team</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { colors: { brand: {50:'#eef2ff',600:'#4f46e5',700:'#4338ca'}, slate:{950:'#020617'} } } } }</script>
</head>
<body class="min-h-screen bg-slate-950 text-white">
  <!-- Top bar -->
  <header class="border-b border-white/10 bg-slate-900/60 backdrop-blur sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="text-lg font-black tracking-tight">JDP<span class="text-brand-600">.team</span></div>
        <span class="text-xs text-slate-400 border border-white/10 rounded-full px-2 py-0.5">Client</span>
      </div>
      <div class="flex items-center gap-3 text-sm">
        <span class="text-slate-300"><span id="userName">…</span></span>
        <button onclick="dash.logout()" class="text-slate-400 hover:text-white">Sign out</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 grid lg:grid-cols-3 gap-6">
    <!-- Orders list -->
    <section class="lg:col-span-1">
      <div class="flex items-center justify-between mb-3">
        <h1 class="text-lg font-bold">Your orders</h1>
        <button onclick="document.getElementById('newOrder').classList.toggle('hidden')" class="text-sm bg-brand-600 hover:bg-brand-700 rounded-lg px-3 py-1.5 font-semibold">+ New order</button>
      </div>
      <div id="orderList" class="space-y-3"></div>
    </section>

    <!-- Detail / messages -->
    <section class="lg:col-span-2">
      <div id="emptyState" class="text-slate-500 text-center py-16 border border-dashed border-white/10 rounded-2xl">Select an order to view its status and conversation.</div>
      <div id="detail" class="hidden space-y-5">
        <div class="bg-white/5 border border-white/10 rounded-2xl p-5">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h2 id="dTitle" class="font-bold text-lg"></h2>
              <div id="dMeta" class="text-sm text-slate-400 mt-1"></div>
            </div>
            <div id="dStatus"></div>
          </div>
          <p id="dBrief" class="text-sm text-slate-300 mt-3 whitespace-pre-wrap"></p>
          <div id="dItems" class="mt-4 space-y-2"></div>
        </div>

        <div class="bg-white/5 border border-white/10 rounded-2xl p-5">
          <h3 class="font-bold mb-3">Conversation with your project manager</h3>
          <div id="msgList" class="space-y-3 max-h-80 overflow-y-auto pr-1"></div>
          <form onsubmit="sendMsg(event)" class="mt-4 flex gap-2">
            <input id="msgInput" class="flex-1 rounded-lg bg-slate-900 border border-white/10 px-3.5 py-2.5 text-sm focus:border-brand-600 focus:outline-none" placeholder="Write a message…" maxlength="2000" required>
            <button class="bg-brand-600 hover:bg-brand-700 rounded-lg px-4 py-2.5 text-sm font-bold">Send</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- New order modal -->
  <div id="newOrder" class="hidden fixed inset-0 bg-black/70 z-20 flex items-center justify-center p-4" onclick="if(event.target===this)this.classList.add('hidden')">
    <form onsubmit="createOrder(event)" class="bg-slate-900 border border-white/10 rounded-2xl p-6 w-full max-w-lg space-y-4">
      <h2 class="font-bold text-lg">New order</h2>
      <p class="text-sm text-slate-400">Pick services and describe what you need. Your PM will scope it before work starts — you pay the quoted price, nothing hidden.</p>
      <div id="svcPicker" class="space-y-2"></div>
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">Project brief</label>
        <textarea id="orderBrief" rows="4" required maxlength="4000" class="w-full rounded-lg bg-slate-950 border border-white/10 px-3.5 py-2.5 text-sm focus:border-brand-600 focus:outline-none" placeholder="What do you need done? Links, brand assets, deadlines…"></textarea>
      </div>
      <div class="flex items-center justify-between">
        <div class="text-sm">Estimated total: <span id="orderTotal" class="font-bold text-emerald-300">$0</span></div>
        <div class="flex gap-2">
          <button type="button" onclick="document.getElementById('newOrder').classList.add('hidden')" class="px-4 py-2 text-sm text-slate-400 hover:text-white">Cancel</button>
          <button class="bg-brand-600 hover:bg-brand-700 rounded-lg px-4 py-2 text-sm font-bold">Submit order</button>
        </div>
      </div>
    </form>
  </div>

<script src="/dashboard/dash.js"></script>
<script>
let orders = [];
let services = [];
let selected = null;

async function boot() {
  if (!(await dash.init('client'))) return;
  await Promise.all([loadOrders(), loadServices()]);
}
async function loadOrders() {
  const res = await fetch('/api/orders');
  orders = (await res.json()).orders || [];
  renderList();
}
async function loadServices() {
  const res = await fetch('/api/services');
  services = ((await res.json()).services || []).filter(s => s.active);
  renderPicker();
}
function renderList() {
  const el = document.getElementById('orderList');
  if (!orders.length) {
    el.innerHTML = '<div class="text-slate-500 text-sm border border-dashed border-white/10 rounded-xl p-6 text-center">No orders yet.<br>Create your first one →</div>';
    return;
  }
  el.innerHTML = orders.map(o => `
    <button onclick="openOrder('${o.id}')" class="w-full text-left bg-white/5 hover:bg-white/10 border ${selected===o.id?'border-brand-600':'border-white/10'} rounded-xl p-4 transition-colors">
      <div class="flex items-center justify-between gap-2">
        <div class="font-semibold text-sm truncate">${dash.esc((o.brief||'').split('\n')[0].slice(0,60)) || 'Order'}</div>
        ${dash.statusBadge(o.status)}
      </div>
      <div class="text-xs text-slate-400 mt-1.5 flex justify-between">
        <span>${o.items.length} item${o.items.length!==1?'s':''} · ${o.billing_cycle==='monthly'?'subscription':'one-time'}</span>
        <span class="font-semibold text-slate-200">${dash.money(o.total_cents)}</span>
      </div>
    </button>`).join('');
}
function renderPicker() {
  document.getElementById('svcPicker').innerHTML = services.map(s => `
    <label class="flex items-center gap-3 bg-slate-950 border border-white/10 rounded-lg px-3.5 py-2.5 cursor-pointer hover:border-brand-600/60">
      <input type="checkbox" class="svc-cb accent-indigo-500" data-id="${s.id}" data-price="${s.price_cents}" onchange="recalc()">
      <span class="flex-1 text-sm">${dash.esc(s.name)} <span class="text-slate-500">(${s.unit})</span></span>
      <input type="number" class="svc-qty w-16 bg-slate-900 border border-white/10 rounded px-1.5 py-1 text-xs text-center" value="1" min="1" max="500" onchange="recalc()">
      <span class="text-sm font-semibold">${dash.money(s.price_cents)}</span>
    </label>`).join('');
}
function recalc() {
  let total = 0;
  document.querySelectorAll('.svc-cb:checked').forEach(cb => {
    const qty = Number(cb.closest('label').querySelector('.svc-qty').value) || 1;
    total += Number(cb.dataset.price) * qty;
  });
  document.getElementById('orderTotal').textContent = dash.money(total);
}
async function createOrder(e) {
  e.preventDefault();
  const items = [];
  document.querySelectorAll('.svc-cb:checked').forEach(cb => {
    items.push({ service_id: cb.dataset.id, qty: Number(cb.closest('label').querySelector('.svc-qty').value) || 1 });
  });
  if (!items.length) { alert('Pick at least one service'); return; }
  const res = await fetch('/api/orders', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ brief: document.getElementById('orderBrief').value, items })
  });
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Failed'); return; }
  document.getElementById('newOrder').classList.add('hidden');
  await loadOrders();
  openOrder(data.order_id);
}
async function openOrder(id) {
  selected = id;
  const o = orders.find(x => x.id === id);
  if (!o) return;
  renderList();
  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('detail').classList.remove('hidden');
  document.getElementById('dTitle').textContent = (o.brief||'').split('\n')[0].slice(0,80) || 'Order ' + o.id;
  document.getElementById('dMeta').textContent = `Placed ${dash.fmtDate(o.created_at)} · ${o.billing_cycle === 'monthly' ? 'Monthly subscription' : 'One-time'} · ${dash.money(o.total_cents)}`;
  document.getElementById('dStatus').innerHTML = dash.statusBadge(o.status);
  document.getElementById('dBrief').textContent = o.brief || '';
  document.getElementById('dItems').innerHTML = o.items.map(i => `
    <div class="flex items-center justify-between bg-slate-900/60 border border-white/5 rounded-lg px-3.5 py-2.5 text-sm">
      <span>${dash.esc(i.service_name)} × ${i.qty} ${i.unit}${i.qty>1?'s':''}</span>
      ${dash.statusBadge(i.status)}
    </div>`).join('');
  loadMessages();
}
async function loadMessages() {
  if (!selected) return;
  const res = await fetch('/api/messages?order_id=' + selected);
  const msgs = (await res.json()).messages || [];
  const mine = dash.me.id;
  document.getElementById('msgList').innerHTML = msgs.length ? msgs.map(m => `
    <div class="flex ${m.role==='client'?'justify-end':''}">
      <div class="max-w-[80%] rounded-xl px-3.5 py-2.5 text-sm ${m.role==='client'?'bg-brand-600/30 border border-brand-600/40':'bg-slate-800 border border-white/10'}">
        <div class="text-[11px] text-slate-400 mb-0.5">${dash.esc(m.display_name)} · ${dash.fmtDate(m.created_at)}</div>
        ${dash.esc(m.body)}
      </div>
    </div>`).join('') : '<div class="text-slate-500 text-sm text-center py-4">No messages yet — say hello to your PM.</div>';
  const list = document.getElementById('msgList');
  list.scrollTop = list.scrollHeight;
}
async function sendMsg(e) {
  e.preventDefault();
  const input = document.getElementById('msgInput');
  const res = await fetch('/api/messages', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ order_id: selected, body: input.value })
  });
  if (res.ok) { input.value = ''; loadMessages(); }
}
boot();
</script>
</body>
</html>
